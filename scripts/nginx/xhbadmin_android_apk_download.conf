# 将 Android 手机浏览器访问管理域名时引导到 APK 下载页/安装包。
# 使用前请先把正式签名 APK 上传到：/data/www/xhbadmin.juxin.pro/download/xiaohebao.apk

map $http_user_agent $xhb_android_device {
    default 0;
    ~*Android 1;
}

server {
    listen 443 ssl http2;
    server_name xhbadmin.juxin.pro;

    # SSL 证书、已有 root、proxy 等配置沿用生产现有配置。

    location = /download/xiaohebao.apk {
        alias /data/www/xhbadmin.juxin.pro/download/xiaohebao.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="xiaohebao.apk"';
    }

    location = /download/android.html {
        alias /data/www/xhbadmin.juxin.pro/download/android.html;
        default_type text/html;
    }

    location = /download/logo.svg {
        alias /data/www/xhbadmin.juxin.pro/download/logo.svg;
        default_type image/svg+xml;
    }

    location / {
        if ($xhb_android_device) {
            return 302 /download/android.html;
        }
        try_files $uri $uri/ /index.html;
    }
}
