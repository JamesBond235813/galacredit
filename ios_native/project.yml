name: GalaCreditIOS
options:
  bundleIdPrefix: com.galacredit
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: 1
    PRODUCT_NAME: GalaCreditIOS
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  GalaCreditIOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galacredit.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GalaCredit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: GalaCredit uses your location for identity and risk review.
        INFOPLIST_KEY_GalaApiBase: $(GALA_API_BASE)
        INFOPLIST_KEY_GalaAppFlavor: $(GALA_APP_FLAVOR)
    scheme:
      testTargets:
        - GalaCreditIOSTests
  GalaCreditIOSTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: GalaCreditIOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_NAME: GalaCreditIOSTests
        PRODUCT_MODULE_NAME: GalaCreditIOSTests
        PRODUCT_BUNDLE_IDENTIFIER: com.galacredit.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: GalaCreditIOS
